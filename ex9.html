<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<title>我的一頁式網站</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="ex9.css">

<style>
body,h1,h2,h3,h4,h5 {
    color: #A67C70;
    font-family: "Poppins","DFKai-SB",sans-serif;
    background-color: #FFF8F0;
}

body {
    font-size: 16px;
}

.photo-grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.photo-grid img {
    width: 30%;
    height: 180px;
    object-fit: contain;
    display: block;
}

.photo-grid img:hover {
    opacity: 0.8;
}

.about-photo {
    width: 250px;
    height: auto;
}

.social-icons a {
    font-size: 30px;
    margin-right: 20px;
    color: #a86f60;
    text-decoration: none;
}

/* 所有照片可以點擊 */
.click-photo,
.photo-grid img {
    cursor: pointer;
}

/* 圖片放大視窗 */
#imageModal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.85);
    text-align: center;
    padding-top: 60px;
}

#modalImg {
    max-width: 85%;
    max-height: 80vh;
    object-fit: contain;
    border: 5px solid white;
    border-radius: 10px;
}

#imageModal .close {
    position: absolute;
    top: 10px;
    right: 30px;
    color: white;
    font-size: 45px;
    font-weight: bold;
    cursor: pointer;
}

@media screen and (max-width: 700px) {
    .w3-main {
        margin-left: 20px !important;
        margin-right: 20px !important;
    }

    .photo-grid img {
        width: 45%;
    }

    .about-content {
        flex-direction: column;
        align-items: flex-start !important;
    }

    .about-photo {
        width: 100%;
        max-width: 250px;
    }
}
</style>
</head>

<body>

<!-- 左側導覽列 -->

<button onclick="w3_open()"
class="w3-button w3-top w3-large"
style="width:50px;top:0;left:0;background-color:#D8A7A7;color:white;z-index:4;">
☰
</button>

<!-- 關閉導覽列按鈕 -->
<button id="closeBtn" onclick="w3_close()"
class="w3-button w3-top w3-large"
style="display:none;width:50px;top:0;left:50px;background-color:#D8A7A7;color:white;z-index:4;">
✕
</button>

<!-- 左側選單 -->
<nav class="w3-sidebar w3-bar-block w3-top w3-large w3-padding"
style="z-index:3;width:300px;font-weight:bold;background-color:#D8A7A7;font-size:20px;display:none;"
id="mySidebar">

<div class="w3-container">
<h3 class="w3-padding-64"><b>我的<br>一頁式網站</b></h3>
</div>

<a href="#home" onclick="w3_close()" class="w3-bar-item w3-button w3-hover-white">首頁</a>
<a href="#about" onclick="w3_close()" class="w3-bar-item w3-button w3-hover-white">關於我</a>
<a href="#interest" onclick="w3_close()" class="w3-bar-item w3-button w3-hover-white">興趣</a>
<a href="#portfolio" onclick="w3_close()" class="w3-bar-item w3-button w3-hover-white">作品集</a>
<a href="#contact" onclick="w3_close()" class="w3-bar-item w3-button w3-hover-white">聯絡我</a>

</nav>

<!-- 網站主要內容 -->
<div class="w3-main" style="margin-left:340px;margin-right:40px">

<!-- 首頁 -->
<div class="w3-container" style="margin-top:80px" id="home">

<h1 class="w3-jumbo"><b>我的一頁式網站</b></h1>

<h1 style="color:#49312F;"><b>Welcome.</b></h1>

<p style="color:#554B3E;font-size:18px;line-height:1.8;">
歡迎來到我的個人網站。
</p>

<hr style="width:50px;border:5px solid red" class="w3-round">

<img src="img/04.jpg"
alt="首頁照片"
class="click-photo"
onclick="openImage(this.src)"
style="width:20%;height:auto;object-fit:contain;">

<h3>電商二甲｜學號：4B455026｜姓名：李佩穎</h3>

</div>

<!-- 關於我 -->
<div class="w3-container" id="about" style="margin-top:75px">

<h1 style="color:#563C45;"><b>關於我.</b></h1>

<hr style="width:50px;border:5px solid red" class="w3-round">

<div class="about-content" style="display:flex;align-items:center;gap:30px;">

<img src="img/04.jpg"
alt="個人照片"
class="about-photo click-photo"
onclick="openImage(this.src)">

<div>
<h3>哈囉！我是佩穎</h3>
<p>我是電商二甲的學生。</p>
<p>這個網站主要介紹我的個人資料、興趣以及作品，歡迎透過這個網站認識我。</p>
</div>

</div>
</div>

<!-- 興趣 -->
<div class="w3-container" id="interest" style="margin-top:75px">

<h1 style="color:#34443D;"><b>我的興趣.</b></h1>

<hr style="width:50px;border:5px solid red" class="w3-round">

<p>以下是我平常喜歡的事物，透過照片分享我的興趣。</p>

<div class="photo-grid">

<img src="img/01.jpg" alt="興趣照片一" onclick="openImage(this.src)">

<img src="img/02.jpg" alt="興趣照片二" onclick="openImage(this.src)">

<img src="img/03.jpg" alt="興趣照片三" onclick="openImage(this.src)">

</div>
</div>

<!-- 作品集 -->
<div class="w3-container" id="portfolio" style="margin-top:75px">

<h1 style="color:#35465A;"><b>我的作品集.</b></h1>

<hr style="width:50px;border:5px solid red" class="w3-round">

<p>這裡展示我的學習成果與作品。</p>

<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">

<img src="img/5111.jpg"
alt="作品一"
class="click-photo"
onclick="openImage(this.src)"
style="width:20%;height:200px;object-fit:cover;">

<img src="img/5114.jpg"
alt="作品二"
class="click-photo"
onclick="openImage(this.src)"
style="width:20%;height:200px;object-fit:cover;">

</div>
</div>

<!-- 聯絡我 -->
<div class="w3-container" id="contact" style="margin-top:75px">

<h1 style="color:#51445D;"><b>聯絡我.</b></h1>

<hr style="width:50px;border:5px solid red" class="w3-round">

<p>歡迎透過以下方式與我聯絡！</p>

<div class="social-icons">
<a href="#" title="Facebook"><i class="fa fa-facebook"></i></a>
<a href="#" title="Instagram"><i class="fa fa-instagram"></i></a>
<a href="#" title="Twitter"><i class="fa fa-twitter"></i></a>
</div>

<p><i class="fa fa-phone"></i> 手機：0912-345-678</p>

<p><i class="fa fa-envelope"></i> Email：4B455026@stust.edu.tw</p>

<img src="img/02.jpg"
alt="聯絡照片"
class="click-photo"
onclick="openImage(this.src)"
style="width:250px;height:300px;object-fit:cover;">

</div>

<!-- 頁尾 -->
<div class="w3-light-grey w3-container w3-center w3-padding-32"
style="margin-top:75px;padding-right:58px">

<p>我的一頁式網站 © 2026</p>

</div>

</div>

<!-- 圖片放大視窗 -->
<div id="imageModal" onclick="closeImage()">

<span class="close">&times;</span>

<img id="modalImg" src="" alt="放大照片">

</div>

<!-- JavaScript -->
<script>

function w3_open() {document.getElementById("mySidebar").style.display = "block";document.getElementById("closeBtn").style.display = "block";}

function w3_close() {document.getElementById("mySidebar").style.display = "none";document.getElementById("closeBtn").style.display = "none";}

function openImage(src) {document.getElementById("imageModal").style.display = "block";document.getElementById("modalImg").src = src;}

function closeImage() {document.getElementById("imageModal").style.display = "none";}

</script>

</body>
</html>
